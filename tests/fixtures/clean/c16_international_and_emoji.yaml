description: "Legitimate RTL prose and ordinary emoji. LRM/RLM are the normal way to keep a version number rendering correctly inside Arabic, and U+FE0F is what makes an emoji render in colour - reporting either turned innocent documents into HIGH findings and hard build failures. Ward's own commit history tripped the emoji case."
