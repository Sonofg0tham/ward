description: "CLI feature PR. 'print all the commands' and 'all the orders' are ordinary product vocabulary; determiner stacking made them HIGH prompt-extraction findings."
inputs:
  - surface: branch_name
    text: "feat/list-commands-json"
  - surface: pr_title
    text: "feat(cli): print all the commands in a table"
  - surface: pr_body
    text: |
      Adds a --json flag so scripts can list all the commands.

      The report endpoint can now return all the orders for a given
      customer id. Run `make help` to list all the available targets.
  - surface: commit_message
    text: "docs: list all the commands in the README table"
